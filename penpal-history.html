    /* ── Base ── */
    body {
      background: var(--t-surface);
      color: var(--t-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .pp-header {
      background: linear-gradient(135deg, var(--t-accent-1) 0%, var(--t-accent-2) 100%);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 11px; flex-shrink: 0; gap: 10px;
    }
    .pp-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .pp-logo { display: inline-flex; align-items: center; width: 22px; height: 22px; color: var(--t-on-accent); }
    .pp-brand-name { font-size: 15px; font-weight: 800; color: var(--t-on-accent); letter-spacing: -0.02em; }
    .pp-brand-sub  { font-size: 10.5px; color: rgba(255,255,255,0.6); margin-top: 1px; }
    .pp-header-btn {
      background: rgba(255,255,255,0.18); border: none; border-radius: 8px;
      color: var(--t-on-accent); cursor: pointer; font-size: 12px; font-weight: 600;
      font-family: inherit; padding: 5px 11px; opacity: 0.85; white-space: nowrap;
      transition: background 0.12s, opacity 0.12s;
    }
    .pp-header-btn:hover { background: rgba(255,255,255,0.3); opacity: 1; }
    .pp-header-btn.pp-confirm { background: #dc2626; opacity: 1; }
    .pp-header-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── History list ── */
    #chat-history {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px 18px 20px;
      display: flex; flex-direction: column; gap: 14px; min-height: 0;
    }
    #chat-placeholder {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--t-you-label); opacity: 0.45; user-select: none; text-align: center;
      padding-bottom: 40px;
    }
    #chat-placeholder svg { width: 36px; height: 36px; }
    #chat-placeholder h3  { font-size: 15px; font-weight: 600; }
    #chat-placeholder p   { font-size: 12.5px; max-width: 280px; }

    .hist-day {
      align-self: center; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--t-you-label);
      background: var(--t-subtle); border-radius: 20px; padding: 3px 10px; margin-top: 6px;
    }
    .hist-entry { display: flex; flex-direction: column; gap: 8px; }
    .hist-time { font-size: 10.5px; color: var(--t-you-label); font-weight: 600; text-transform: none; letter-spacing: 0; opacity: 0.85; }

    /* ── Chat turns (matches the other PenPal views) ── */
    .chat-turn { display: flex; flex-direction: column; gap: 4px; }
    .chat-turn-you { align-items: flex-start; }
    .chat-turn-ai  { align-items: flex-end; }
    .chat-turn-content { display: flex; flex-direction: column; gap: 4px; max-width: 82%; min-width: 120px; }
    .chat-bubble-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--t-you-label);
    }
    .chat-ai-header, .chat-you-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chat-ai-label { color: var(--t-ai-label); }
    .chat-bubble {
      border-radius: 14px; font-size: 13.5px; line-height: 1.65;
      padding: 10px 14px; white-space: pre-wrap; word-break: break-word;
    }
    .chat-you-bubble {
      background: var(--t-you-bg); border: 1.5px solid var(--t-chip-border); color: var(--t-you-fg);
      border-radius: 4px 14px 14px 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    .chat-ai-bubble {
      background: linear-gradient(135deg, var(--t-accent-1) 0%, var(--t-accent-2) 100%);
      color: var(--t-on-accent); border-radius: 14px 4px 14px 14px;
      box-shadow: 0 4px 20px var(--t-glow);
    }
    .chat-actions { display: flex; gap: 6px; }
    .chat-turn-you .chat-actions { justify-content: flex-start; }
    .chat-turn-ai  .chat-actions { justify-content: flex-end; }
    .chat-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--t-subtle); border: 1.5px solid var(--t-ring);
      border-radius: 20px; color: var(--t-ai-label); cursor: pointer;
      font-family: inherit; font-size: 10.5px; font-weight: 600;
      padding: 2px 9px; flex-shrink: 0; transition: all 0.12s; white-space: nowrap;
    }
    .chat-btn:hover { background: var(--t-ring); border-color: var(--t-accent-1); }
    .chat-turn-you .chat-btn { background: transparent; border-color: var(--t-chip-border); color: var(--t-you-label); }
    .chat-turn-you .chat-btn:hover { background: var(--t-subtle); border-color: var(--t-accent-1); color: var(--t-accent-1); }

    /* ── Toast ── */
    #hist-toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(10px);
      background: var(--t-accent-1); color: var(--t-on-accent);
      font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.22); opacity: 0; pointer-events: none;
      transition: opacity 0.15s, transform 0.15s;
    }
    #hist-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="pp-header">
    <div class="pp-brand">
      <span class="pp-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      </span>
      <div>
        <div class="pp-brand-name">Rewrite History</div>
        <div class="pp-brand-sub" id="hist-count">PenPal AI</div>
      </div>
    </div>
    <button class="pp-header-btn" id="hist-clear" title="Delete all saved history">Clear all</button>
  </div>

  <div id="chat-history">
    <div id="chat-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      <h3>No history yet</h3>
      <p>Your rewrites will be saved here as you use PenPal, with the newest at the bottom.</p>
    </div>
  </div>

  <div id="hist-toast"></div>

  <script src="penpal-history.js"></script>
</body>
